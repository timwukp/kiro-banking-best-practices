name: Repository Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check required files exist
        run: |
          ERRORS=0
          for file in .gitignore LICENSE README.md CHANGELOG.md CONTRIBUTING.md \
            AGENTS.md QUICK-REFERENCE.md \
            Kiro-Agentic-SDLC-Banking-Best-Practices.md \
            Kiro-Banking-Best-Practices-Part2.md \
            Banking-Skills-Development-Guide.md \
            CLAUDE.md SECURITY.md \
            managed-settings/README.md agent-hooks/README.md; do
            if [ ! -f "$file" ]; then
              echo "::error::Required file missing: $file"
              ERRORS=$((ERRORS + 1))
            fi
          done
          exit $ERRORS

      - name: Check no PDFs tracked
        run: |
          if git ls-files | grep -iE '\.(pdf)$'; then
            echo "::error::PDF files found in git tracking"
            exit 1
          fi

      - name: Check no .kiro config tracked (skills and steering samples are allowed)
        run: |
          if git ls-files | grep -E '\.kiro/(specs|hooks|settings)/'; then
            echo "::error::.kiro config files found in git tracking (specs/hooks/settings should be gitignored)"
            exit 1
          fi

      - name: Scan for secrets
        run: |
          ERRORS=0
          # AWS access key IDs (lines containing EXAMPLE/example are the documented placeholder).
          # Only file:line is printed, so a leaked key does not end up in the CI log.
          AKIA_HITS="$(grep -r -n -E 'AKIA[0-9A-Z]{16}' \
              --include='*.md' --include='*.ts' --include='*.json' --include='*.sh' --include='*.tsv' . \
            | grep -v 'EXAMPLE' | grep -v 'example' | grep -v 'node_modules' || true)"
          if [ -n "$AKIA_HITS" ]; then
            echo "$AKIA_HITS" | cut -d: -f1-2
            echo "::error::Potential AWS access key detected"
            ERRORS=$((ERRORS + 1))
          fi
          # Private keys (exclude the pii-detection skill and its tests, which document the
          # detection signature itself, and the agent-hooks test fixtures)
          if grep -r -l 'BEGIN.*PRIVATE KEY' \
               --include='*.md' --include='*.ts' --include='*.pem' --include='*.key' --include='*.tsv' . \
             | grep -v '.kiro/skills/pii-detection/' | grep -v 'agent-hooks/tests/fixtures/' \
             | grep -v 'node_modules'; then
            echo "::error::Private key material detected"
            ERRORS=$((ERRORS + 1))
          fi
          exit $ERRORS

      - name: Validate markdown structure
        run: |
          for md in *.md; do
            if ! head -5 "$md" | grep -qE '^# '; then
              echo "::warning::$md missing H1 heading in first 5 lines"
            fi
          done

      - name: Run repository validator (read-only)
        run: ./validate-repo.sh

  validate-cdk:
    name: Validate CDK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cdk/package-lock.json

      - name: Install CDK dependencies
        working-directory: cdk
        run: npm ci

      - name: Security audit
        working-directory: cdk
        # Blocking gate: the lockfile has no high or critical advisories (moderate ones are
        # reviewed manually). Fix a new finding by upgrading the dependency or with `npm audit fix`;
        # do not reintroduce continue-on-error.
        run: npm audit --audit-level=high

      - name: TypeScript compile check
        working-directory: cdk
        run: npx tsc

      - name: ESLint check
        working-directory: cdk
        run: npm run lint

      - name: Run CDK tests
        working-directory: cdk
        run: npx jest

      - name: CDK synth (validates all stacks + CDK Nag)
        working-directory: cdk
        # cdk.json "build" compiles with tsc before synth; the app runs from build/.
        run: npx cdk synth --context env=dev 2>&1
        env:
          CDK_DEFAULT_ACCOUNT: '000000000000'
          CDK_DEFAULT_REGION: 'ap-southeast-1'

  validate-skills:
    name: Validate Kiro Skills
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check skill structure
        run: |
          ERRORS=0
          for skill_dir in .kiro/skills/*/; do
            skill_name=$(basename "$skill_dir")
            # Check SKILL.md exists
            if [ ! -f "${skill_dir}SKILL.md" ]; then
              echo "::error::Missing SKILL.md in $skill_dir"
              ERRORS=$((ERRORS + 1))
              continue
            fi
            # Check frontmatter has required fields
            if ! head -10 "${skill_dir}SKILL.md" | grep -q 'name:'; then
              echo "::error::Missing 'name' in frontmatter of ${skill_dir}SKILL.md"
              ERRORS=$((ERRORS + 1))
            fi
            if ! head -10 "${skill_dir}SKILL.md" | grep -q 'description:'; then
              echo "::error::Missing 'description' in frontmatter of ${skill_dir}SKILL.md"
              ERRORS=$((ERRORS + 1))
            fi
            # Check name matches folder
            YAML_NAME=$(grep '^name:' "${skill_dir}SKILL.md" | head -1 | sed 's/name: *//')
            if [ "$YAML_NAME" != "$skill_name" ]; then
              echo "::warning::Skill name '$YAML_NAME' doesn't match folder '$skill_name'"
            fi
          done
          exit $ERRORS

      - name: PII pattern regression tests (grep -E + perl PCRE)
        run: bash .kiro/skills/pii-detection/tests/patterns.test.sh

  validate-governance:
    name: Validate Governance (hooks, managed settings, MDM)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
          jq --version

      - name: Agent hook regression tests
        run: bash agent-hooks/tests/run-tests.sh

      - name: Verify agent-hooks/SHA256SUMS
        working-directory: agent-hooks
        run: sha256sum -c SHA256SUMS

      - name: Validate managed-settings JSON (parse + deny/ask effects only)
        run: |
          ERRORS=0
          for f in managed-settings/*.json; do
            if ! jq empty "$f"; then
              echo "::error file=$f::invalid JSON"
              ERRORS=$((ERRORS + 1))
            fi
          done
          # Admin policy files: an "allow" (or any other) effect makes Kiro reject the whole file.
          for f in managed-settings/managed-settings*.json; do
            if ! jq -e '[.rules[].effect] | all(. == "deny" or . == "ask")' "$f" >/dev/null; then
              echo "::error file=$f::rules may only use effect \"deny\" or \"ask\""
              ERRORS=$((ERRORS + 1))
            fi
          done
          exit $ERRORS

      - name: Validate agent-hooks JSON
        run: |
          ERRORS=0
          for f in agent-hooks/*.json agent-hooks/hooks/*.json; do
            if ! jq empty "$f"; then
              echo "::error file=$f::invalid JSON"
              ERRORS=$((ERRORS + 1))
            fi
          done
          exit $ERRORS

      - name: MDM lockdown dry-run tests (non-root, no system changes)
        run: bash mdm/tests/test-lockdown.sh

      - name: Shell syntax check (bash -n)
        run: |
          ERRORS=0
          while IFS= read -r f; do
            if ! bash -n "$f"; then
              echo "::error file=$f::bash syntax error"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(git ls-files '*.sh')
          exit $ERRORS
